name: SackReligious CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  SMOKE_HEADED: "1"
  GAME_URL: http://127.0.0.1:8080/

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run preview > artifacts/preview.log 2>&1 &
          echo $! > artifacts/preview.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/ >/dev/null; then
              echo "Production preview is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Preview did not become ready on port 8080"
          cat artifacts/preview.log || true
          exit 1

      - name: Memphis smoke
        run: xvfb-run -a node scripts/memphis-smoke.mjs

      - name: Confirm smoke screenshots
        run: |
          set -euo pipefail
          missing=0
          for f in \
            01-title.png \
            02-plaza.png \
            03-hq.png \
            04-court.png \
            05-pier.png \
            06-bowl.png \
            07-race.png \
            08-funhouse.png
          do
            if [ ! -s "artifacts/$f" ]; then
              echo "MISSING: artifacts/$f"
              missing=1
            else
              echo "OK: artifacts/$f ($(wc -c < "artifacts/$f") bytes)"
            fi
          done
          exit "$missing"

      - name: Black-frame and pixel variance
        run: node scripts/qa-frames.mjs artifacts

      - name: Preview log on failure
        if: failure()
        run: cat artifacts/preview.log || true

      - name: Stage QA screenshots
        if: always()
        run: |
          set -eu
          mkdir -p qa-screenshots
          if [ -d artifacts ]; then
            cp -a artifacts/. qa-screenshots/
          fi
          find qa-screenshots -type f -print

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sackreligious-qa
          path: qa-screenshots/
          if-no-files-found: warn
